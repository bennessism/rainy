<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <title>Window</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .room{padding:0;background:linear-gradient(90deg,#1b1d20,#2b2e31 50%,#1a1c1f)}
    .room-wall{position:absolute;inset:5vh 3vw 4vh;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#2f3235 0%,#282b2e 72%,#202326 100%);box-shadow:inset 0 1px rgba(255,255,255,.03),inset 0 -34px 70px rgba(0,0,0,.18)}
    .room-track{--sill-line:clamp(54px,calc(50% - min(37vh,380px)),16vh);position:absolute;inset:0;display:grid;grid-template-columns:minmax(190px,1fr) auto minmax(230px,1fr);align-items:center;gap:clamp(24px,3vw,56px);padding:9vh clamp(22px,3vw,54px) 5vh}
    .room-zone{position:relative;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
    .main-zone{z-index:5}.room-light{z-index:2;top:-4vh!important;width:min(108vw,1200px)!important;height:min(70vh,760px)!important;background:radial-gradient(ellipse at 50% 6%,rgba(255,215,151,.34),rgba(255,177,91,.17) 29%,rgba(255,150,60,.06) 50%,transparent 75%)!important}
    .ceiling-lamp{z-index:18!important;left:50%;top:-10vh;height:82px}.lamp-cord{height:18px!important}.lamp-socket{top:22px!important}.lamp-shade{top:35px!important}
    .window-recess{position:relative;z-index:5;padding:21px 22px 27px;border-radius:30px;background:linear-gradient(145deg,#383c40,#1b1f23 72%);box-shadow:inset 18px 18px 28px rgba(0,0,0,.3),inset -7px -7px 14px rgba(255,255,255,.025),0 12px 26px rgba(0,0,0,.22)}
    .window-recess:before{content:"";position:absolute;inset:8px 9px 12px;border-radius:23px;border:1px solid rgba(255,255,255,.04);pointer-events:none}.window-shell{z-index:1;overflow:visible}.window-shell:before{content:"";position:absolute;z-index:18;left:-12px;right:-12px;top:-12px;height:8px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#3b4147,#1b2025);box-shadow:0 2px 6px rgba(0,0,0,.35)}.window-shell:after{left:-24px!important;right:-24px!important;bottom:-20px!important;height:20px!important;border-radius:3px 3px 10px 10px!important;background:linear-gradient(180deg,#343a40,#161b1f)!important;box-shadow:0 10px 18px rgba(0,0,0,.3)!important}

    .window-blinds{position:absolute;z-index:24;left:7px;right:7px;top:6px;height:calc(100% - 12px);border:0;background:none;padding:0;cursor:pointer;pointer-events:auto}.blind-headrail{position:absolute;z-index:3;left:0;right:0;top:0;height:32px;border-radius:10px 10px 5px 5px;background:linear-gradient(180deg,#e4ddd2 0%,#bcb2a4 52%,#91887d 100%);box-shadow:0 6px 12px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.6),inset 0 -2px rgba(72,64,57,.25)}.blind-headrail:before{content:"";position:absolute;left:13px;right:13px;top:8px;height:10px;border-radius:6px;background:linear-gradient(180deg,#b1a89d,#888076);box-shadow:inset 0 1px rgba(255,255,255,.2)}.blind-headrail:after{content:"";position:absolute;right:12px;top:10px;width:8px;height:8px;border-radius:50%;background:#746d65;box-shadow:0 0 0 2px rgba(255,255,255,.14)}.blind-sheet{position:absolute;left:13px;right:13px;top:28px;height:0;border-radius:0 0 8px 8px;background:repeating-linear-gradient(180deg,#ded8cf 0 9px,#c4bcb1 9px 11px,#e8e2d9 11px 20px);box-shadow:0 10px 18px rgba(0,0,0,.2);overflow:hidden;transition:height .45s cubic-bezier(.2,.8,.2,1)}.blind-sheet:after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(180deg,#b5ada1,#8f877c);box-shadow:0 -1px rgba(255,255,255,.2),0 2px 4px rgba(0,0,0,.22)}.blind-chain{position:absolute;z-index:4;right:12px;top:31px;width:2px;height:48px;background:repeating-linear-gradient(180deg,#aba397 0 2px,transparent 2px 5px);opacity:.82}.blind-chain:after{content:"";position:absolute;left:-3px;bottom:-6px;width:8px;height:8px;border:1px solid #9c9488;border-radius:50%}
    .is-day[data-weather="clear"] .blind-sheet{height:24%}.is-day[data-weather="partly-cloudy"] .blind-sheet{height:14%}.is-day[data-weather="cloudy"] .blind-sheet{height:6%}.is-night .blind-sheet,.app[data-weather="rain"] .blind-sheet,.app[data-weather="heavy-rain"] .blind-sheet,.app[data-weather="storm"] .blind-sheet,.app[data-weather="drizzle"] .blind-sheet,.app[data-weather="fog"] .blind-sheet{height:0}.app.blinds-manual .blind-sheet{height:var(--blind-drop)!important}.window-bars .bar-v{left:calc(50% - 5px);top:0;bottom:0;width:10px}.bar-h{display:none!important}

    .left-zone{justify-content:flex-end;align-items:stretch}.music-corner{position:relative;width:min(22vw,280px);height:100%;display:flex;align-items:flex-end;justify-content:center}.side-table{position:absolute;left:3%;right:3%;bottom:calc(var(--sill-line) - 22px);height:22px;border-radius:7px;background:linear-gradient(180deg,#765a45,#4b382d);box-shadow:0 10px 22px rgba(0,0,0,.3)}.side-table:before,.side-table:after{content:"";position:absolute;top:18px;width:13px;height:46vh;background:linear-gradient(90deg,#3b2c25,#604738,#352720)}.side-table:before{left:14%}.side-table:after{right:14%}.music-box{position:absolute;left:50%;bottom:var(--sill-line);width:170px;height:118px;transform:translateX(-50%);border:0;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 12px 16px rgba(0,0,0,.3))}.music-base{position:absolute;left:8px;right:8px;bottom:0;height:62px;border-radius:8px 8px 11px 11px;background:linear-gradient(160deg,#865f3e,#573b29 66%,#3a281e);box-shadow:inset 0 2px rgba(255,255,255,.12),inset 0 -7px 12px rgba(0,0,0,.2)}.music-base:after{content:"";position:absolute;inset:9px 14px;border:1px solid rgba(233,190,126,.28);border-radius:5px}.music-lid{position:absolute;left:16px;right:16px;bottom:57px;height:52px;border-radius:9px 9px 4px 4px;background:linear-gradient(155deg,#9b714a,#63432e);transform-origin:50% 100%;transform:perspective(170px) rotateX(-39deg);box-shadow:inset 0 2px rgba(255,255,255,.13)}.music-stage{position:absolute;left:37px;right:37px;bottom:57px;height:18px;border-radius:50%;background:#c6aa77;box-shadow:0 0 0 4px #4d3528}.music-disc{position:absolute;left:58px;bottom:60px;width:54px;height:22px;border-radius:50%;background:repeating-radial-gradient(circle,#d9c28f 0 4px,#8f754d 5px 7px,#d9c28f 8px 11px);border:2px solid #6d5337;box-shadow:0 2px 5px rgba(0,0,0,.28);transform-origin:50% 50%;animation:disc-turn 4.8s linear infinite}.music-disc:after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#5a4432;transform:translate(-50%,-50%)}.music-key{position:absolute;right:0;bottom:25px;width:16px;height:4px;background:#b39b72;border-radius:3px;transform-origin:left center;animation:key-turn 2.4s linear infinite}.music-key:after{content:"";position:absolute;right:-8px;top:-5px;width:10px;height:10px;border:2px solid #b39b72;border-radius:50%}.music-box:not(.playing) .music-disc,.music-box:not(.playing) .music-key{animation-play-state:paused}@keyframes disc-turn{to{transform:rotate(360deg)}}@keyframes key-turn{to{transform:rotate(360deg)}}.music-note{position:absolute;left:50%;bottom:132px;font-size:11px;color:rgba(244,220,177,.4);opacity:0;transform:translateX(-50%)}.music-box.playing .music-note{animation:note-rise 3.5s ease-out infinite}@keyframes note-rise{0%{opacity:0;transform:translate(-50%,4px)}25%{opacity:.48}100%{opacity:0;transform:translate(-16px,-38px)}}
    .wall-lamp{position:absolute;left:5%;bottom:calc(var(--sill-line) + 150px);width:74px;height:104px;border:0;background:none;padding:0;cursor:pointer;z-index:5}.wall-lamp-glow{position:absolute;left:8px;top:17px;width:58px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(255,194,111,.32),rgba(255,164,71,.1) 48%,transparent 72%);filter:blur(8px);pointer-events:none}.wall-lamp-arm{position:absolute;left:34px;top:38px;width:31px;height:6px;border-radius:5px;background:linear-gradient(180deg,#695d52,#332e2a);transform:rotate(-12deg);transform-origin:left center}.wall-lamp-base{position:absolute;left:27px;top:31px;width:13px;height:33px;border-radius:7px;background:linear-gradient(90deg,#3b3530,#74695f,#332e2a)}.wall-lamp-shade{position:absolute;right:0;top:25px;width:36px;height:30px;clip-path:polygon(24% 0,76% 0,100% 100%,0 100%);background:linear-gradient(180deg,#d7b17c,#95703f);filter:drop-shadow(0 4px 5px rgba(0,0,0,.25))}.wall-lamp.off .wall-lamp-glow{opacity:0}.wall-lamp.off .wall-lamp-shade{background:linear-gradient(180deg,#756b61,#4a433d)}

    .right-zone{justify-content:flex-start;align-items:stretch}.bookcase{position:absolute;left:0;bottom:var(--sill-line);width:min(24vw,320px);height:min(22vh,190px);min-height:150px;margin:0;border-radius:8px 8px 4px 4px;background:linear-gradient(90deg,#4a3529,#6c4b38 12%,#51392d 88%,#38271f);box-shadow:0 18px 34px rgba(0,0,0,.32),inset 0 0 0 3px rgba(45,29,22,.72);padding:12px 15px 14px;display:block}.bookcase:before{content:"";position:absolute;left:-8px;right:-8px;bottom:-2px;height:17px;border-radius:4px;background:linear-gradient(180deg,#805b43,#4a3328);box-shadow:0 4px 8px rgba(0,0,0,.3);z-index:4}.bookcase:after{content:"";position:absolute;left:5px;right:5px;top:calc(100% - 2px);height:48vh;background:linear-gradient(90deg,#3e2d23,#604432 12%,#4a3429 88%,#33231d);box-shadow:inset 0 0 0 3px rgba(45,29,22,.65);z-index:-1}.shelf{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:8px 8px 15px;background:linear-gradient(180deg,rgba(28,18,14,.18),rgba(0,0,0,.11));border-radius:3px;box-shadow:inset 0 -10px 15px rgba(0,0,0,.1)}.shelf:after{content:"";position:absolute;left:-5px;right:-5px;bottom:0;height:12px;border-radius:3px;background:linear-gradient(180deg,#78543e,#4a3328);box-shadow:0 3px 5px rgba(0,0,0,.28)}.shelf[data-shelf="lower"]{display:none}.book{position:relative;z-index:2;flex:0 0 clamp(30px,3vw,42px);min-width:24px;max-width:44px;border:0;border-radius:2px 3px 1px 1px;padding:0;cursor:default;box-shadow:inset 2px 0 rgba(255,255,255,.09),inset -2px 0 rgba(0,0,0,.13),0 2px 4px rgba(0,0,0,.2);transform-origin:bottom}.book:nth-child(3n+1){height:72%;background:#6f5443}.book:nth-child(3n+2){height:91%;background:#51616a}.book:nth-child(3n){height:80%;background:#74654b}.book.enabled{cursor:pointer}.book.enabled:hover{transform:translateY(-4px)}.book-label{position:absolute;left:50%;top:7px;bottom:7px;writing-mode:vertical-rl;transform:translateX(-50%);font-size:7px;letter-spacing:.08em;color:rgba(255,255,255,.55);overflow:hidden;white-space:nowrap}

    .room-dots{display:none;position:absolute;z-index:22;left:50%;bottom:20px;transform:translateX(-50%);gap:8px}.room-dot{width:7px;height:7px;border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.28)}.room-dot.active{background:rgba(255,255,255,.82)}
    .roof-detail{position:absolute;display:block;pointer-events:none}.antenna{left:50%;top:-18px;width:2px;height:18px;background:#454f58;transform:translateX(-50%)}.antenna:after{content:"";position:absolute;left:50%;top:-2px;width:5px;height:5px;border-radius:50%;background:#505b65;transform:translateX(-50%)}.dish{right:12%;top:-9px;width:13px;height:7px;border:2px solid #46515b;border-top:0;border-radius:0 0 12px 12px;transform:rotate(-18deg)}.dish:after{content:"";position:absolute;left:5px;bottom:-5px;width:2px;height:5px;background:#46515b}.tank{left:12%;top:-7px;width:14px;height:8px;border-radius:3px;background:#3d4750}.utility{right:14%;top:-8px;width:16px;height:8px;background:#3b454d;border-radius:2px}

    @media(max-width:900px){.room-wall{inset:0;border-radius:0}.room-track{--sill-line:12vh;display:flex;align-items:stretch;gap:0;padding:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}.room-track.drawing-fog{overflow-x:hidden;scroll-snap-type:none}.room-track::-webkit-scrollbar{display:none}.room-zone{flex:0 0 100%;height:100%;scroll-snap-align:start;padding:10vh 5vw 8vh}.left-zone,.right-zone{justify-content:center}.main-zone{padding-top:12vh}.music-corner{width:min(76vw,340px);height:100%}.wall-lamp{left:7%;bottom:calc(var(--sill-line) + 145px)}.bookcase{left:50%;transform:translateX(-50%);width:min(78vw,350px);height:min(23vh,190px);bottom:var(--sill-line)}.window-recess{padding:13px 13px 19px;border-radius:22px}.window-shell:after{left:-17px!important;right:-17px!important;bottom:-14px!important;height:14px!important}.room-light{width:145vw!important;height:58vh!important;top:-5vh!important}.ceiling-lamp{top:-1vh}.window-blinds{left:4px;right:4px;top:4px}.blind-headrail{height:27px}.blind-sheet{top:24px;left:9px;right:9px}.blind-chain{top:27px;right:9px}.room-dots{display:flex}}
  </style>
</head>
<body>
  <main class="app is-night" id="app">
    <header class="brand"><strong>Window</strong><button class="weather-chip" id="weatherToggle" type="button" aria-expanded="false" aria-controls="weatherPanel"><span id="weatherLabel">Sabah · loading weather</span><span class="weather-chevron" aria-hidden="true">⌄</span></button></header>

    <section class="weather-panel" id="weatherPanel" hidden aria-label="Weather details"><div class="weather-card"><div class="weather-card-head"><div><strong id="weatherPlace">Sabah · Kota Kinabalu</strong><span id="weatherCondition">Loading weather…</span></div><button id="weatherClose" type="button" aria-label="Close weather details">×</button></div><div class="weather-temp-row"><strong id="weatherTemp">--°C</strong><span id="weatherFeels">Feels --°C</span></div><div class="weather-grid"><div><span>Cloud</span><strong id="weatherCloud">--%</strong></div><div><span>Rain now</span><strong id="weatherRain">-- mm</strong></div><div><span>Humidity</span><strong id="weatherHumidity">--%</strong></div><div><span>Wind</span><strong id="weatherWind">-- km/h</strong></div></div><div class="weather-card-foot"><span id="weatherUpdated">Updated --</span><button id="weatherLocationButton" type="button">Change location</button></div></div></section>

    <section class="room" aria-label="A quiet room overlooking the city">
      <div class="room-wall">
        <div class="room-light" aria-hidden="true"></div>
        <div class="room-track" id="roomTrack">
          <section class="room-zone left-zone" data-room-page="left" aria-label="Music box corner">
            <div class="music-corner">
              <button class="wall-lamp" id="wallLampButton" type="button" aria-label="Toggle wall lamp" aria-pressed="true"><span class="wall-lamp-glow"></span><span class="wall-lamp-base"></span><span class="wall-lamp-arm"></span><span class="wall-lamp-shade"></span></button>
              <div class="side-table"></div>
              <button class="music-box" id="musicBox" type="button" aria-pressed="false" aria-label="Start the music box"><span class="music-lid"></span><span class="music-stage"></span><span class="music-disc"></span><span class="music-base"></span><span class="music-key"></span><span class="music-note">♪</span></button>
            </div>
          </section>

          <section class="room-zone main-zone" data-room-page="main" aria-label="Weather window">
            <button class="ceiling-lamp" id="lampButton" type="button" aria-label="Toggle ceiling lamp" aria-pressed="true"><span class="lamp-canopy"></span><span class="lamp-cord"></span><span class="lamp-socket"></span><span class="lamp-shade"></span></button>
            <div class="window-recess">
              <button class="window-blinds" id="blindButton" type="button" aria-label="Adjust blinds" aria-pressed="false"><span class="blind-headrail"></span><span class="blind-sheet"></span><span class="blind-chain"></span></button>
              <section class="window-shell" aria-label="Two-panel weather window">
                <div class="window-scene" id="windowScene"><div class="sky" aria-hidden="true"><div class="sky-glow"></div><div class="cloud cloud-a"></div><div class="cloud cloud-b"></div><div class="cloud cloud-c"></div></div><div class="skyline far" aria-hidden="true"><i class="bldg f1"></i><i class="bldg f2"><span class="roof-detail tank"></span></i><i class="bldg f3"></i><i class="bldg f4"><span class="roof-detail antenna"></span></i><i class="bldg f5"></i></div><div class="skyline mid" aria-hidden="true"><i class="bldg m1 tower-light"><span class="roof-detail antenna"></span></i><i class="bldg m2"><span class="roof-detail dish"></span></i><i class="bldg m3 tower-light"><span class="roof-detail utility"></span></i><i class="bldg m4"><span class="roof-detail tank"></span></i></div><div class="skyline near" aria-hidden="true"><i class="bldg n1"></i><i class="bldg n2 tower-light"><span class="roof-detail dish"></span></i><i class="bldg n3"><span class="roof-detail utility"></span></i></div><div class="haze" aria-hidden="true"></div><canvas id="rainCanvas" aria-hidden="true"></canvas><div class="lightning" id="lightning" aria-hidden="true"></div><canvas id="fogCanvas" aria-label="Glass. Drag to write or draw when condensation is visible."></canvas><div class="glass-reflection" aria-hidden="true"></div><div class="window-bars" aria-hidden="true"><i class="bar-v"></i></div><div class="hint" id="hint">Draw on the glass</div></div>
              </section>
            </div>
          </section>

          <section class="room-zone right-zone" data-room-page="right" aria-label="Bookshelf"><div class="bookcase" id="bookcase"><div class="shelf" data-shelf="top"><button class="book" data-book-id="book-1"><span class="book-label"></span></button><button class="book" data-book-id="book-2"><span class="book-label"></span></button><button class="book" data-book-id="book-3"><span class="book-label"></span></button><button class="book" data-book-id="book-4"><span class="book-label"></span></button><button class="book" data-book-id="book-5"><span class="book-label"></span></button><button class="book" data-book-id="book-6"><span class="book-label"></span></button></div><div class="shelf" data-shelf="lower"></div></div></section>
        </div>
      </div>
      <div class="room-dots" id="roomDots"><button class="room-dot" data-page="0" aria-label="Music box"></button><button class="room-dot active" data-page="1" aria-label="Window"></button><button class="room-dot" data-page="2" aria-label="Bookshelf"></button></div>
    </section>

    <nav class="control-dock" id="controlDock" aria-label="Window controls"><div class="control-items" id="controlItems"><button id="lampControl" type="button">Lamp · On</button><button id="clearButton" type="button">Fog · Off</button><button id="placeButton" type="button">Location</button></div><button class="dock-toggle" id="dockToggle" type="button" aria-label="Open controls" aria-expanded="false"><span></span><span></span><span></span><span></span></button></nav>

    <section class="place-panel" id="placePanel" aria-label="Weather location" hidden><div class="place-card"><div class="place-head"><strong>Weather location</strong><button id="closePlace" type="button" aria-label="Close location">×</button></div><label>Country<select id="countrySelect"></select></label><label>Location<select id="locationSelect"></select></label><div class="weather-meta" id="weatherMeta">Weather cache refreshes every 6 hours.</div></div></section>
    <footer class="source-note">Weather data: Open-Meteo · cached by this site</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
