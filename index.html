<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <title>Window</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .room{padding-top:10vh}
    .room-light{left:50%;right:auto;top:2vh;bottom:auto;width:min(64vw,760px);height:min(46vw,520px);transform:translateX(-50%);background:radial-gradient(ellipse at 50% 14%,rgba(255,197,112,.24),rgba(255,164,72,.08) 38%,transparent 72%)}
    .ceiling-lamp{position:absolute;z-index:8;left:calc(50% + 28px);top:0;width:112px;height:132px;transform:translateX(-50%);border:0;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 12px 18px rgba(0,0,0,.28))}
    .lamp-canopy{position:absolute;left:38px;top:0;width:36px;height:9px;border-radius:0 0 12px 12px;background:linear-gradient(180deg,#57514c,#353230);box-shadow:inset 0 -1px rgba(255,255,255,.05)}
    .lamp-cord{position:absolute;left:54px;top:8px;width:4px;height:54px;border-radius:4px;background:linear-gradient(90deg,#393634,#615b56,#353230)}
    .lamp-socket{position:absolute;left:46px;top:58px;width:20px;height:19px;border-radius:6px 6px 8px 8px;background:linear-gradient(90deg,#403c38,#706860 50%,#3d3936);box-shadow:inset 0 1px rgba(255,255,255,.08)}
    .lamp-shade{position:absolute;left:20px;top:70px;width:72px;height:43px;border-radius:10px 10px 18px 18px;background:linear-gradient(180deg,#d7b17c,#9b7042);clip-path:polygon(24% 0,76% 0,100% 100%,0 100%)}
    .lamp-shade:after{content:"";position:absolute;left:10px;right:10px;bottom:-8px;height:17px;border-radius:50%;background:rgba(255,207,126,.92);box-shadow:0 0 34px 14px rgba(255,180,83,.28)}
    .app.lamp-off .lamp-shade{background:linear-gradient(180deg,#71685d,#47413a)}
    .app.lamp-off .lamp-shade:after{opacity:.05;box-shadow:none}
    @media(max-width:760px){.room{padding-top:10.5vh}.ceiling-lamp{left:50%;width:96px;height:112px}.lamp-canopy{left:32px;width:32px;height:8px}.lamp-cord{left:47px;top:7px;height:43px}.lamp-socket{left:39px;top:47px;width:20px;height:18px}.lamp-shade{left:16px;top:61px;width:66px;height:39px}.room-light{top:1vh;width:92vw;height:42vh}}
    @media(max-width:430px){.ceiling-lamp{height:104px}.lamp-cord{height:36px}.lamp-socket{top:40px}.lamp-shade{top:54px}}
  </style>
</head>
<body>
  <main class="app is-night" id="app">
    <header class="brand">
      <strong>Window</strong>
      <span id="weatherLabel">Sabah · loading weather</span>
    </header>

    <section class="room" aria-label="A quiet room overlooking the city">
      <div class="room-light" aria-hidden="true"></div>

      <button class="ceiling-lamp" id="lampButton" type="button" aria-label="Toggle ceiling lamp" aria-pressed="true">
        <span class="lamp-canopy"></span>
        <span class="lamp-cord"></span>
        <span class="lamp-socket"></span>
        <span class="lamp-shade"></span>
      </button>

      <section class="window-shell" aria-label="Weather window">
        <div class="window-scene" id="windowScene">
          <div class="sky" aria-hidden="true">
            <div class="sky-glow"></div>
            <div class="cloud cloud-a"></div>
            <div class="cloud cloud-b"></div>
            <div class="cloud cloud-c"></div>
          </div>

          <div class="skyline far" aria-hidden="true">
            <i class="bldg f1"></i><i class="bldg f2"></i><i class="bldg f3"></i><i class="bldg f4"></i><i class="bldg f5"></i>
          </div>
          <div class="skyline mid" aria-hidden="true">
            <i class="bldg m1 tower-light"></i><i class="bldg m2"></i><i class="bldg m3 tower-light"></i><i class="bldg m4"></i>
          </div>
          <div class="skyline near" aria-hidden="true">
            <i class="bldg n1"></i><i class="bldg n2 tower-light"></i><i class="bldg n3"></i>
          </div>

          <div class="haze" aria-hidden="true"></div>
          <canvas id="rainCanvas" aria-hidden="true"></canvas>
          <div class="lightning" id="lightning" aria-hidden="true"></div>
          <canvas id="fogCanvas" aria-label="Fogged glass. Drag to write or draw on the window."></canvas>
          <div class="glass-reflection" aria-hidden="true"></div>

          <div class="window-bars" aria-hidden="true">
            <i class="bar-v"></i>
            <i class="bar-h"></i>
          </div>

          <div class="hint" id="hint">Draw on the glass</div>
        </div>
      </section>
    </section>

    <nav class="control-dock" id="controlDock" aria-label="Window controls">
      <div class="control-items" id="controlItems">
        <button id="lampControl" type="button">Lamp · On</button>
        <button id="clearButton" type="button">Fog Glass</button>
        <button id="placeButton" type="button">Location</button>
      </div>
      <button class="dock-toggle" id="dockToggle" type="button" aria-label="Open controls" aria-expanded="false">
        <span></span><span></span><span></span><span></span>
      </button>
    </nav>

    <section class="place-panel" id="placePanel" aria-label="Weather location" hidden>
      <div class="place-card">
        <div class="place-head">
          <strong>Weather location</strong>
          <button id="closePlace" type="button" aria-label="Close location">×</button>
        </div>
        <label>Country<select id="countrySelect"></select></label>
        <label>Location<select id="locationSelect"></select></label>
        <div class="weather-meta" id="weatherMeta">Weather cache refreshes every 6 hours.</div>
      </div>
    </section>

    <footer class="source-note">Weather data: Open-Meteo · cached by this site</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
