<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <title>Window</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app is-night" id="app">
    <header class="brand">
      <strong>Window</strong>
      <button class="weather-chip" id="weatherToggle" type="button" aria-expanded="false" aria-controls="weatherPanel">
        <span id="weatherLabel">Sabah · loading weather</span>
        <span class="weather-chevron" aria-hidden="true">⌄</span>
      </button>
    </header>

    <section class="weather-panel" id="weatherPanel" hidden aria-label="Weather details">
      <div class="weather-card">
        <div class="weather-card-head">
          <div>
            <strong id="weatherPlace">Sabah · Kota Kinabalu</strong>
            <span id="weatherCondition">Loading weather…</span>
          </div>
          <button id="weatherClose" type="button" aria-label="Close weather details">×</button>
        </div>
        <div class="weather-temp-row">
          <strong id="weatherTemp">--°C</strong>
          <span id="weatherFeels">Feels --°C</span>
        </div>
        <div class="weather-grid">
          <div><span>Cloud</span><strong id="weatherCloud">--%</strong></div>
          <div><span>Rain now</span><strong id="weatherRain">-- mm</strong></div>
          <div><span>Humidity</span><strong id="weatherHumidity">--%</strong></div>
          <div><span>Wind</span><strong id="weatherWind">-- km/h</strong></div>
        </div>
        <div class="weather-card-foot">
          <span id="weatherUpdated">Updated --</span>
          <button id="weatherLocationButton" type="button">Change location</button>
        </div>
      </div>
    </section>

    <section class="room" aria-label="A quiet room overlooking the city">
      <div class="room-light" aria-hidden="true"></div>

      <button class="ceiling-lamp" id="lampButton" type="button" aria-label="Toggle ceiling lamp" aria-pressed="true">
        <span class="lamp-canopy"></span>
        <span class="lamp-cord"></span>
        <span class="lamp-socket"></span>
        <span class="lamp-shade"></span>
      </button>

      <section class="window-shell" aria-label="Weather window">
        <div class="window-scene" id="windowScene">
          <div class="sky" aria-hidden="true">
            <div class="sky-glow"></div>
            <div class="cloud cloud-a"></div>
            <div class="cloud cloud-b"></div>
            <div class="cloud cloud-c"></div>
          </div>

          <div class="skyline far" aria-hidden="true">
            <i class="bldg f1"></i><i class="bldg f2"></i><i class="bldg f3"></i><i class="bldg f4"></i><i class="bldg f5"></i>
          </div>
          <div class="skyline mid" aria-hidden="true">
            <i class="bldg m1 tower-light"></i><i class="bldg m2"></i><i class="bldg m3 tower-light"></i><i class="bldg m4"></i>
          </div>
          <div class="skyline near" aria-hidden="true">
            <i class="bldg n1"></i><i class="bldg n2 tower-light"></i><i class="bldg n3"></i>
          </div>

          <div class="haze" aria-hidden="true"></div>
          <canvas id="rainCanvas" aria-hidden="true"></canvas>
          <div class="lightning" id="lightning" aria-hidden="true"></div>
          <canvas id="fogCanvas" aria-label="Glass. Drag to write or draw when condensation is visible."></canvas>
          <div class="glass-reflection" aria-hidden="true"></div>

          <div class="window-bars" aria-hidden="true">
            <i class="bar-v"></i>
            <i class="bar-h"></i>
          </div>

          <div class="hint" id="hint">Draw on the glass</div>
        </div>
      </section>
    </section>

    <nav class="control-dock" id="controlDock" aria-label="Window controls">
      <div class="control-items" id="controlItems">
        <button id="lampControl" type="button">Lamp · On</button>
        <button id="clearButton" type="button">Fog Glass</button>
        <button id="placeButton" type="button">Location</button>
      </div>
      <button class="dock-toggle" id="dockToggle" type="button" aria-label="Open controls" aria-expanded="false">
        <span></span><span></span><span></span><span></span>
      </button>
    </nav>

    <section class="place-panel" id="placePanel" aria-label="Weather location" hidden>
      <div class="place-card">
        <div class="place-head">
          <strong>Weather location</strong>
          <button id="closePlace" type="button" aria-label="Close location">×</button>
        </div>
        <label>Country<select id="countrySelect"></select></label>
        <label>Location<select id="locationSelect"></select></label>
        <div class="weather-meta" id="weatherMeta">Weather cache refreshes every 6 hours.</div>
      </div>
    </section>

    <footer class="source-note">Weather data: Open-Meteo · cached by this site</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
