<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a111a">
  <title>Rainy Window</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <div class="room-glow" aria-hidden="true"></div>

    <section class="window-scene" aria-label="Rainy window">
      <div class="city" aria-hidden="true">
        <div class="sky-glow"></div>
        <div class="building building-a"></div>
        <div class="building building-b"></div>
        <div class="building building-c"></div>
        <div class="building building-d"></div>
      </div>

      <canvas id="rainCanvas" aria-hidden="true"></canvas>
      <canvas id="fogCanvas" aria-label="Fogged glass. Drag to write or draw on the window."></canvas>
      <div class="glass-reflection" aria-hidden="true"></div>
      <div class="window-frame" aria-hidden="true">
        <i class="frame-v"></i>
        <i class="frame-h"></i>
      </div>

      <div class="hint" id="hint">Drag on the glass</div>
    </section>

    <button class="lamp" id="lampButton" type="button" aria-label="Toggle lamp" aria-pressed="true">
      <span class="lamp-shade"></span>
      <span class="lamp-neck"></span>
      <span class="lamp-base"></span>
    </button>

    <header class="brand">
      <strong>Rainy Window</strong>
      <span>a quiet little place</span>
    </header>

    <nav class="control-dock" id="controlDock" aria-label="Rainy Window controls">
      <div class="control-items" id="controlItems">
        <button id="rainButton" type="button">Rain · Normal</button>
        <button id="lampControl" type="button">Lamp · On</button>
        <button id="clearButton" type="button">Fog Glass</button>
      </div>
      <button class="dock-toggle" id="dockToggle" type="button" aria-label="Open controls" aria-expanded="false">
        <span></span><span></span><span></span><span></span>
      </button>
    </nav>
  </main>

  <script src="app.js"></script>
</body>
</html>
